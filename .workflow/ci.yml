# Gitee Go pipeline — validate only (test, build, compat, pack:check).
# E2E and bench run locally via `npm run verify` or on GitHub Actions.
# Enable: Gitee repo → 流水线 → 开通 Gitee Go → 从仓库导入本文件。
# Note: .github/workflows/*.yml is GitHub Actions only; it does not run on Gitee.
version: '1.0'
name: ci
displayName: CI 验证
triggers:
  push:
    branches:
      include:
        - master
        - main
        - '**'
  pr:
    branches:
      include:
        - master
        - main
stages:
  - stage: validate
    displayName: 单元测试 / 构建 / compat / 打包检查
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: npm_validate
        displayName: npm test + build + compat + pack:check
        nodeVersion: 22.18.0
        commands:
          - npm ci --registry=https://registry.npmmirror.com
          - npm test
          - npm run build
          - npm run test:compat
          - npm run pack:check
